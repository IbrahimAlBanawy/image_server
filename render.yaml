services:
  - type: web
    name: image-server
    runtime: python
    buildCommand: pip install -r app/requirements.txt
    startCommand: gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.13
      - key: IMAGE_STORAGE
        value: /data/images
      - key: THUMBNAIL_STORAGE
        value: /data/thumbnails
    disk:
      name: image-storage
      mountPath: /data
      sizeGB: 1
